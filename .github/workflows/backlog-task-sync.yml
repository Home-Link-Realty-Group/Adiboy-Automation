name: Backlog Task Sync

on:
  push:
    paths:
      - docs/reconstruction-backlog.md
      - scripts/sync-backlog-to-issues.mjs
      - .github/workflows/backlog-task-sync.yml
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"

permissions:
  contents: read
  issues: write
  repository-projects: write

jobs:
  sync-backlog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync backlog into issues/project board
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run backlog:sync
